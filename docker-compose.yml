services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bydlo
      POSTGRES_PASSWORD: bydlo
      POSTGRES_DB: bydloland
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bydlo -d bydloland"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bydlo:bydlo@postgres:5432/bydloland
      BACKEND_URL: http://backend:8080
      HOST: 0.0.0.0
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bydlo:bydlo@postgres:5432/bydloland
      BACKEND_URL: http://backend:8080
    command: ["python", "-m", "bot.main"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
