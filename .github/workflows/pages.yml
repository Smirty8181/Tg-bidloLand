name: Mini App demo (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy static demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
        env:
          VITE_DEMO_MODE: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp/dist
      - id: deployment
        uses: actions/deploy-pages@v4
